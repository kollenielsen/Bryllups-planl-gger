# Render Blueprint — serverversionen af agenten.
#
# BEMÆRK: render.com var blokeret fra det miljø, denne fil blev skrevet i, så
# feltnavne og plan-værdier er IKKE efterprøvet mod Renders aktuelle
# blueprint-spec. Afvises filen ved import, så opret servicen manuelt i
# dashboardet — indstillingerne nedenfor er de samme, og kommentarerne
# forklarer hvorfor hver enkelt er valgt.

services:
  - type: web
    name: bryllupsplanlaegger
    runtime: docker
    dockerfilePath: ./Dockerfile

    # Samme kontinent som databasen. Supabase-projektet ligger i eu-central-1
    # (Frankfurt), og hver eneste forespørgsel betaler turen frem og tilbage.
    region: frankfurt

    # IKKE gratis-planen. En gratis web service lukker ned ved inaktivitet, og
    # så holder outbox-worker'en op med at tikke. Køen takter mails med fire
    # minutters mellemrum inden for kontortid — den skal køre uafbrudt, ellers
    # stopper afsendelsen stille og roligt uden at fejle synligt.
    # Bekræft plan-navnet i dashboardet; jeg har ikke kunnet slå det op.
    plan: starter

    healthCheckPath: /health

    envVars:
      # Slår adgangskoden fra "åben med advarsel" til "påkrævet", og får appen
      # til at nægte at starte hvis APP_PASSWORD mangler.
      - key: NODE_ENV
        value: production

      - key: APP_USER
        value: bryllup
      # Lad Render generere den. Den skal aldrig stå i repoet.
      - key: APP_PASSWORD
        generateValue: true

      # Sættes i dashboardet. Hentes i Supabase under Connect.
      # Vælg session pooler-strengen hvis den direkte fejler med en
      # netværksfejl — den direkte vært er IPv6 på nyere projekter.
      - key: DATABASE_URL
        sync: false

      # DATABASE_SSL sættes bevidst ikke: Supabase kræver TLS, og
      # resolveSslOption() slår det til for alt der ikke er localhost.

      - key: ANTHROPIC_API_KEY
        sync: false

      # Bruges af den indgående webhook. Uden maildomæne er den ubrugt, men
      # den skal være sat, før webhooken peges et sted hen.
      - key: INBOUND_WEBHOOK_SECRET
        generateValue: true

      # Sidste skridt før live mail er at sætte denne til false — bevidst, og
      # først når SPF, DKIM og DMARC er på plads på EMAIL_REPLY_DOMAIN.
      - key: DRY_RUN
        value: "true"

      # Sæt til servicens egen URL når Render har tildelt den.
      - key: BASE_URL
        sync: false
